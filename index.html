<title>Valerie's Workout</title>
<style>
:root{
  --bg:#0E1116;--card:#171B23;--card2:#1E2330;--line:rgba(255,255,255,.07);
  --text:#F3F5F9;--muted:#99A2B3;--dim:#6B7385;
  --acc:#FF7A59;--acc2:#FF9F7A;--ok:#3DD6B5;--warn:#F5B544;
  --A:#FF7A59;--B:#3DD6B5;--C:#8B7CF6;--D:#F5B544;
  --r:20px;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
a{color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:calc(var(--safeT) + 18px) 18px calc(var(--safeB) + 110px)}
h1{font-size:30px;line-height:1.1;margin:4px 0 4px;letter-spacing:-.02em}
h2{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack>*+*{margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card2);font-size:13px;color:var(--muted);font-weight:600}
.pill.acc{background:rgba(255,122,89,.15);color:var(--acc2)}
.vbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 2px}.vbar .yt{padding:6px 2px;margin-left:auto}
.pill.fav{background:rgba(245,181,68,.16);color:var(--warn)}
.pill.cm{background:rgba(61,214,181,.14);color:var(--ok)}
.cmn{margin-top:8px;font-size:14px;color:var(--muted);line-height:1.4}
.kneel{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:12px 14px;min-height:48px;border-radius:14px;background:var(--card2);color:var(--txt,#fff);font-size:15px;font-weight:600;text-align:left}
.kneel .sw{margin-left:auto;width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative;flex:none}
.kneel .sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.kneel.on .sw{background:var(--ok)}
.kneel.on .sw:after{left:21px}
.novid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:8px;font-size:15px;color:var(--muted);background:var(--card2)}
.novid a{color:var(--acc2);font-weight:700}
.kneel-note{margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(245,181,68,.14);color:var(--warn);font-size:14px;line-height:1.4}
button.pill.alt{min-height:36px;background:var(--card2);color:var(--acc2);border:1px solid rgba(255,122,89,.35)}
.pill.ok{background:rgba(61,214,181,.14);color:var(--ok)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;border-radius:18px;font-weight:700;font-size:18px;padding:0 20px;width:100%}
.btn.pri{background:linear-gradient(135deg,var(--acc),#F05A8C);color:#fff;box-shadow:0 8px 24px rgba(255,100,100,.25)}
.btn.ok{background:linear-gradient(135deg,#2EC4A6,#3DD6B5);color:#07211b}
.btn.sec{background:var(--card2);color:var(--text)}
.btn.ghost{background:transparent;color:var(--muted);min-height:48px;font-size:16px}
.btn:active{transform:scale(.98)}
.icon-btn{width:46px;height:46px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.knee{display:flex;gap:10px;align-items:center;background:rgba(245,181,68,.12);color:#F7C766;border-radius:14px;padding:11px 14px;font-weight:600;font-size:15px}
.tip{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted);padding:6px 0}
.tip b{color:var(--text);font-weight:600}
/* home */
.hello{margin:6px 0 18px}
.week{display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:6px}.dots i{width:28px;height:8px;border-radius:9px;background:var(--card2)}.dots i.on{background:var(--ok)}
.day{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);width:100%;text-align:left;min-height:92px;position:relative}
.day:active{transform:scale(.99)}
.badge{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:24px;color:#0E1116;flex:none}
.day .t{font-weight:700;font-size:18px}
.day .s{font-size:14px;color:var(--muted);margin-top:2px}
.day .l{font-size:13px;margin-top:6px;color:var(--dim)}
.day .l.done{color:var(--ok)}
.next{position:absolute;top:12px;right:12px}
.chev{color:var(--dim);font-size:22px}
/* overview */
.sec-t{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:22px 4px 10px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.thumb{width:84px;height:56px;border-radius:12px;background:#000 center/cover;flex:none;position:relative}
.thumb:after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:14px;text-shadow:0 1px 6px #000}
.item .n{font-weight:650;font-size:16px;line-height:1.2}
.item .m{font-size:13px;color:var(--muted);margin-top:3px}
.swap{min-width:52px;height:46px;border-radius:14px;background:var(--card2);font-size:13px;font-weight:700;color:var(--acc2);display:grid;place-items:center;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(var(--safeB) + 14px);background:linear-gradient(to top,var(--bg) 70%,rgba(14,17,22,0));z-index:5}
.bottom .in{max-width:520px;margin:0 auto}
/* run */
.prog{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#F05A8C);border-radius:9px;transition:width .4s}
.phase{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc2)}
.video{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000 center/cover;border:1px solid var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);text-decoration:none;padding:10px 2px}
.exname{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.15;margin:4px 0 8px}
.cue{font-size:16px;line-height:1.45;color:#CDD3DE;margin:10px 0 0}
.sets{display:flex;gap:8px}
.sets i{flex:1;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--dim);font-size:15px}
.sets i.cur{background:rgba(255,122,89,.16);color:var(--acc2);outline:2px solid rgba(255,122,89,.5)}
.sets i.done{background:rgba(61,214,181,.15);color:var(--ok)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:56px;height:56px;border-radius:16px;background:var(--card2);font-size:26px;font-weight:600;flex:none}
.stepper .val{flex:1;text-align:center}
.stepper input{width:100%;background:transparent;border:0;color:var(--text);font-size:30px;font-weight:750;text-align:center;font-family:inherit;outline:none;padding:0}
.stepper .u{font-size:13px;color:var(--muted);margin-top:-2px}
.lbl{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.seg{display:flex;gap:8px}.seg button{flex:1;height:50px;border-radius:14px;background:var(--card2);font-weight:650;color:var(--muted)}
.seg button.on{background:rgba(255,122,89,.18);color:var(--acc2);outline:2px solid rgba(255,122,89,.45)}
.heavy{background:rgba(61,214,181,.12);color:var(--ok);border-radius:14px;padding:11px 14px;font-weight:650;font-size:15px}
.last{font-size:14px;color:var(--muted)}
.ringbox{display:grid;place-items:center;margin:8px 0 4px;position:relative}
.ring{width:190px;height:190px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--card2)}.ring .fg{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ringtxt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringtxt .big{font-size:52px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ringtxt .sm{font-size:14px;color:var(--muted);font-weight:600;margin-top:-4px}
.ctrls{display:flex;gap:10px}.ctrls .btn{flex:1}
.ctrls .side{flex:0 0 76px}
function dock(h){const d=$("#dockin");if(d)d.innerHTML=h}
/* rest overlay */
#rest{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--safeT) + 20px) 22px calc(var(--safeB) + 24px)}
#rest.on{display:flex}
#rest .in{width:100%;max-width:420px;text-align:center}
#rest .ring{width:250px;height:250px}
#rest .ringtxt .big{font-size:68px}
.nextup{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;margin-top:18px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .pane{width:100%;max-width:520px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px 18px calc(var(--safeB) + 18px);max-height:92vh;overflow:auto}
.grab{width:44px;height:5px;border-radius:9px;background:var(--card2);margin:0 auto 14px}
.toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:16px}
.sw{width:50px;height:30px;border-radius:20px;background:var(--card2);position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on:after{left:23px}
.center{text-align:center}
.done-emoji{font-size:72px;margin:30px 0 6px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px}

:root{--mBase:#2A3040;--mOff:#323A4D;--mPri:#FF7A59;--mSec:rgba(255,159,122,.45)}
.mbox{display:flex;gap:12px;align-items:center;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
svg.body{width:160px;height:158px;flex:none}svg.body .blab{font-size:10px;fill:var(--dim);text-anchor:middle;font-weight:600}
.mtxt{font-size:15px;font-weight:650;line-height:1.35}.mtxt .muted{font-weight:500;font-size:13px}
svg.mthumb{width:70px;height:70px;flex:none;display:block}
.mthumbbtn{background:var(--card2);border-radius:12px;padding:3px 4px;flex:none}
.item .mm{color:var(--acc2);font-weight:600}
.swap span{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:-6px}
.prefs{display:flex;gap:8px;margin-top:12px}.prefs button{flex:1;height:44px;border-radius:14px;background:var(--card2);font-weight:650;font-size:14px;color:var(--muted)}
.prefs button.on{background:rgba(61,214,181,.16);color:var(--ok);outline:2px solid rgba(61,214,181,.45)}.prefs button.on.no{background:rgba(240,90,90,.16);color:#FF8A8A;outline-color:rgba(240,90,90,.5)}
.rounds{padding:10px 12px}
.rhead,.rrow{display:grid;grid-template-columns:44px 1fr 1fr 58px;gap:8px;align-items:center}
.rhead{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;padding:0 0 6px}.rhead span{text-align:center}
.rrow{padding:6px 0;border-top:1px solid var(--line)}.rrow .rn{font-weight:750;font-size:18px;text-align:center;color:var(--muted)}
.ri{width:100%;height:50px;border-radius:14px;background:var(--card2);border:1px solid transparent;color:var(--text);font:inherit;font-size:22px;font-weight:750;text-align:center;outline:none;padding:0}
.ri:focus{border-color:rgba(255,122,89,.6)}.ri.none{display:grid;place-items:center;color:var(--dim);font-size:18px}.ri.bandb{font-size:15px;color:var(--acc2)}
.chk{height:50px;border-radius:14px;background:var(--card2);font-size:24px;font-weight:800;color:var(--dim);border:2px solid rgba(255,255,255,.12)}
.chk.on{background:var(--ok);color:#06231c;border-color:var(--ok)}
.rrow.done .ri{background:rgba(61,214,181,.08);color:var(--ok)}
.rate{display:flex;gap:6px;align-items:center;padding:0 0 8px 52px}.rate button{flex:1;height:36px;border-radius:12px;background:var(--card2);font-size:13px;font-weight:700;color:var(--muted)}
.rate button.on.Easy{background:rgba(61,214,181,.2);color:var(--ok)}.rate button.on.Medium{background:rgba(245,181,68,.2);color:var(--warn)}.rate button.on.Hard{background:rgba(240,90,90,.2);color:#FF8A8A}
.rate.big{padding:0;flex-wrap:wrap;justify-content:center}.rate.big span{width:100%;margin-bottom:6px}.rate.big button{height:48px;font-size:16px}
.ctrls3{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px}
#rest .ring{width:200px!important;height:200px!important}#rest .ringtxt .big{font-size:56px!important}
.altitem{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.altitem .n{font-weight:650;font-size:16px}.altitem .m{font-size:13px;color:var(--muted);margin-top:3px}
#toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 110px);transform:translate(-50%,20px);background:#2B3242;color:var(--text);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A59"/><stop offset="1" stop-color="#F05A8C"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2EC4A6"/><stop offset="1" stop-color="#7BE7CF"/></linearGradient></defs></svg>
<div id="app"></div>
<div id="rest"></div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="pane" id="sheetPane"></div></div>

kb_sword_chop:{g:"core",f:"chop",n:"Sword Chop (seated)",v:"2ghsZegLZRE",c:"Sit tall on the bench edge, feet flat and wide. Hold the bell by the handle with both hands next to one ear, like a sword. Chop it down across your body to the outside of the other hip. Lift it back up slowly. Turn from your ribs. Switch sides halfway.",e:"Kettlebell · Bench",w:"lb",r:"8-12",s:1,fav:1,cm:1,kb:1,sw:18,m:[["obliques","abs"],["shoulders","lats"]],cmn:"He chops kneeling on a mat. You sit on the bench, so your knee is out of it and your legs stay still.",kn:{n:"Sword Chop (kneeling)",v:"BslVJKQXlcQ",e:"Kettlebell · Mat · Knee pads",fb:"https://www.facebook.com/coddellmutate/posts/one-kettlebell-four-movements-20-reps-zero-set-downs-this-kneeling-kettlebell-co/3073140103064371/",c:"Kneel tall on a padded mat, hips over knees. Bell by the handle next to one ear, like a sword. Chop it down across your body to the outside of the other hip. Lift back slowly. Switch sides halfway."}},
kb_digger:{g:"core",f:"chop",n:"Digger (seated low-to-high chop)",v:"4dU7fj-n6w4",c:"Sit tall on the bench edge, feet flat and wide. Hold the bell with both hands next to the outside of one knee. Lift it up and across to above the other shoulder, like tossing a shovel of dirt. Lower slowly the same way. Switch sides halfway.",e:"Kettlebell · Bench",w:"lb",r:"8-12",s:1,fav:1,cm:1,kb:1,sw:18,m:[["obliques","shoulders"],["abs","lowerback"]],cmn:"He digs kneeling. You sit on the bench. Same low-to-high path.",kn:{n:"Digger (kneeling)",v:"mQvotoz6kqA",e:"Kettlebell · Mat · Knee pads",fb:"https://www.facebook.com/coddellmutate/posts/one-kettlebell-four-movements-20-reps-zero-set-downs-this-kneeling-kettlebell-co/3073140103064371/",c:"Kneel tall on a padded mat, hips over knees. Bell low next to one knee. Lift it up and across to above the other shoulder, like tossing a shovel of dirt. Lower slowly. Switch sides halfway."}},
kb_underhand_twist:{g:"core",f:"rot",n:"Underhand Twist (standing)",v:"DPXlencbmiQ",c:"Stand tall, feet hip-width, soft knees. Hold the bell from underneath with both hands, arms long at chest height. Turn your ribs to one side, then the other. Hips and knees keep facing forward. Wobbly? Sit on the bench.",e:"Kettlebell",w:"lb",r:"8-12",s:1,fav:1,cm:1,kb:1,sw:18,m:[["obliques","abs"],["shoulders"]],cmn:"He twists kneeling. You stand (soft knees, hips still) or sit on the bench.",kn:{n:"Underhand Twist (kneeling)",v:"SpEq-y7wyNc",e:"Kettlebell · Mat · Knee pads",fb:"https://www.facebook.com/coddellmutate/posts/one-kettlebell-four-movements-20-reps-zero-set-downs-this-kneeling-kettlebell-co/3073140103064371/",c:"Kneel tall on a padded mat, hips over knees. Hold the bell from underneath, arms long at chest height. Turn your ribs to one side, then the other. Hips stay facing forward."}},
kb_rainbow:{g:"core",f:"arc",n:"Side-to-Side Pullover (rainbow)",v:"he-mx5--fyI",c:"Stand next to a wall, feet hip-width, soft knees. Hold the bell by the horns over your head, elbows soft. Arc it slowly over your head from one shoulder to the other, like a rainbow. Ribs down, belly tight. Start with small arcs. Wobbly? Sit on the bench.",e:"Kettlebell · Wall",w:"lb",r:"8-12",s:1,fav:1,cm:1,kb:1,sw:18,m:[["obliques","shoulders"],["abs","lats","triceps"]],cmn:"He does side-to-side pullovers kneeling. You stand by a wall (or sit on the bench).",kn:{n:"Side-to-Side Pullover (kneeling)",v:"",e:"Kettlebell · Mat · Knee pads",fb:"https://www.facebook.com/coddellmutate/posts/one-kettlebell-four-movements-20-reps-zero-set-downs-this-kneeling-kettlebell-co/3073140103064371/",c:"Kneel tall on a padded mat, hips over knees. Bell by the horns over your head, elbows soft. Arc it slowly from one shoulder to the other. Ribs down, belly tight. Small arcs."}},

function setSecs(k){const e=EX[k];if(e.t)return e.t;const [lo,hi]=repRange(k);return ((lo+hi)/2)*3*(e.s?2:1)+5}
function restLen(){return LS.get("restLen",60)}
function mainSecs(day,b,r){return DAYS[day].slots.reduce((a,sl,j)=>a+sl.n*(setSecs(b[j])+(r||sl.rest)),0)}
function genBlocks(day,extraAvoid){
 const avoid=recentSet(day);(extraAvoid||[]).forEach(k=>avoid.add(k));
 let best=null,bestD=1e9;
 for(let tries=0;tries<80;tries++){
  const used=new Set(),fams=new Set(),b=[];
  DAYS[day].slots.forEach(sl=>{const k=choose(pool(sl),used,fams,avoid,sl);b.push(k);used.add(k);fams.add(EX[k].g+EX[k].f)});
  /* the core finisher (fin) is extra: it is left out of the ~20 min fit so its pick does not depend on length */
  const m=DAYS[day].slots.reduce((t,sl,j)=>sl.fin?t:t+sl.n*(setSecs(b[j])+sl.rest),0)/60,d=m<17?17-m:m>21?m-21:0;
  if(d<bestD){best=b;bestD=d}if(d===0)break}
 return best}
function stretchPool(g,z){return Object.keys(EX).filter(k=>EX[k].g===g&&(EX[k].z===z||EX[k].z==="any")).concat(g==="warm"?WARM_EXTRA[z]:[]).filter(k=>prefOf(k)!=="never")}
function genStretches(g,z,avoid){
 const first=g==="warm"?"march":null,last=g==="cool"?"breathing":null;
 let p=stretchPool(g,z).filter(k=>k!==first&&k!==last);
 let fresh=wshuffle(p.filter(k=>!avoid.has(k))),old=wshuffle(p.filter(k=>avoid.has(k)));
 let pick=fresh.concat(old).slice(0,6);
 pick.sort((a,b)=>(EX[a].pos||0)-(EX[b].pos||0));
 if(first)pick.unshift(first);if(last)pick.push(last);

function generate(day,extraAvoid){
 const D=DAYS[day],avoid=recentSet(day);(extraAvoid||[]).forEach(k=>avoid.add(k));

function swapSlot(day,j){const p=getPlan(day),sl=DAYS[day].slots[j];const used=new Set(p.b),fams=new Set(p.b.filter((_,i)=>i!==j).map(k=>EX[k].g+EX[k].f));

/* Replace: 3-5 moves for the same muscles, best match first */
function altsFor(day,j){const p=getPlan(day),cur=p.b[j],sl=DAYS[day].slots[j],used=new Set(p.b),cm=musclesOf(cur)[0];
 const score=k=>(EX[k].f===EX[cur].f?3:0)+musclesOf(k)[0].filter(m=>cm.includes(m)).length*2+(EX[k].fav?.6:0)+(sl.cm&&EX[k].cm?1:0)+(prefOf(k)==="more"?1.5:prefOf(k)==="less"?-1.5:0)+Math.random()*1.2;

 if(c.length<3)c=c.concat(Object.keys(EX).filter(k=>EX[k].g===sl.g&&!used.has(k)&&!c.includes(k)&&prefOf(k)!=="never"));

function skipPhase(){stopTimer();const ph=S.steps[S.i].ph;while(S.i<S.steps.length&&S.steps[S.i].ph===ph)S.i++;S.set=0;S.auto=false;show()}

function setW(k,v){const w=LS.get("wt",{});w[k]=(v===""||v==null)?null:parseFloat(v);LS.set("wt",w)}
function setBand(k,x){const b=LS.get("band",{});b[k]=x;LS.set("band",b)}
/* ===== progression: ratings + reps decide next time's target (saved in localStorage "prog") ===== */
const BANDS=["Light","Medium","Heavy"];
const wStep=w=>w<20?2.5:5;
const RATES=["Easy","Medium","Hard"];
function lastLog(k){return LS.get("hist",{})[k]}
function nextTarget(k,rows){const e=EX[k],[lo,hi]=repRange(k),d=rows.filter(r=>r.done);if(!d.length)return null;
 const rates=d.map(r=>r.rate||"Medium"),hard=rates.includes("Hard"),easy=rates.filter(x=>x==="Easy").length>=Math.ceil(d.length/2);
 const L=d[d.length-1],lw=(L.w===""||L.w==null)?null:+L.w,lb=L.band||"Medium";
 if(e.t){const sec=Math.max(...d.map(r=>+r.sec||e.t));
  if(hard)return {sec:Math.max(15,sec-5),w:lw,why:"down"};
  if(easy){if(e.w==="lb"&&lw&&sec>=e.t+10)return {sec:e.t,w:wUp(k,lw),why:"up"};return {sec:Math.min(e.t+20,sec+5),w:lw,why:"up"}}
  return {sec,w:lw,why:"same"}}
 const reps=d.map(r=>+r.r||0),minR=Math.min(...reps),allTop=reps.every(r=>r>=hi);
 if(hard&&minR<lo){if(e.w==="lb"&&lw)return {w:wDown(k,lw),reps:lo+1,why:"down"};
  if(e.w==="band"){const i=BANDS.indexOf(lb);return {band:BANDS[Math.max(0,i-1)],reps:lo+1,why:"down"}}return {reps:lo,why:"down"}}
 if(hard)return {w:lw,band:lb,reps:Math.max(lo,Math.min(hi,minR)),why:"same"};
 if(easy&&allTop){if(e.w==="lb"&&lw)return {w:wUp(k,lw),reps:lo,why:"up"};
  if(e.w==="band"){const i=BANDS.indexOf(lb);if(i<2)return {band:BANDS[i+1],reps:lo,why:"up"};return {band:lb,reps:hi,why:"slow"}}
  return {w:lw,reps:hi,why:"slow"}}
 return {w:lw,band:lb,reps:Math.min(hi,minR+(easy?2:1)),why:"more"}}
function advice(k){const e=EX[k],[lo,hi]=repRange(k),L=lastLog(k);
 const rs=L?(L.rounds||(L.reps||[]).map(r=>({r,w:L.w,band:L.band,done:true}))):[];
 let P=(LS.get("prog",{}))[k];if(!P&&rs.length)P=nextTarget(k,rs.map(r=>({...r,done:true})));
 const t={w:P&&P.w!=null?P.w:(LS.get("wt",{})[k]??(e.sw??"")),band:(P&&P.band)||LS.get("band",{})[k]||"Medium",reps:(P&&P.reps)||Math.round((lo+hi)/2),sec:(P&&P.sec)||e.t,why:(P&&P.why)||""};
 if(!L)return {...t,text:`<b>First time.</b> ${e.w==="lb"&&e.sw?`Starting bell: <b>${lbTxt(k,e.sw)}</b>. Do ${lo}-${hi} slow reps${e.s?" each side":""}. If ${lo} good reps is too hard, go one bell lighter.`:e.w==="lb"?`Pick a weight you can lift ${hi} times with good form.`:e.w==="band"?"Start with a Medium band.":e.t?"Go easy. Hold support if needed.":"Slow and steady."}`};
 const f=rs[0]||{},load=e.w==="lb"&&f.w?lbTxt(k,f.w)+" × ":e.w==="band"?(f.band||"Medium")+" band × ":"";
 const did=e.t?rs.map(r=>(r.sec||e.t)+" s").join(", "):rs.map(r=>r.r).join(", ")+" reps";
 const cnt={};rs.forEach(r=>r.rate&&(cnt[r.rate]=(cnt[r.rate]||0)+1));const feel=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
 const load2=e.w==="lb"&&t.w!==""&&t.w!=null?lbTxt(k,t.w):e.w==="band"?t.band+" band":"";
 const goal=e.t?t.sec+" s":t.reps+" reps";
 const today={up:e.t?`a little longer: <b>${goal}</b>${load2&&t.w!==f.w?" with "+load2:""}.`:e.w==="lb"?`a little heavier: <b>${load2} × ${goal}</b>.`:e.w==="band"?`a stronger band: <b>${load2} × ${goal}</b>.`:`<b>${goal}</b>.`,
  down:`a little easier: <b>${load2?load2+" × ":""}${goal}</b>.`,same:`same again: <b>${load2?load2+" × ":""}${goal}</b>.`,
  more:`same ${e.w==="lb"?"weight":e.w==="band"?"band":"move"}, try <b>${load2?load2+" × ":""}${goal}</b>.`,
  slow:`same, but <b>slower</b> (3 s down). ${goal}.`}[t.why]||`<b>${load2?load2+" × ":""}${goal}</b>.`;
 return {...t,text:`Last time (${fmtDate(L.d)}): ${load}${did}${feel?" · felt "+feel:""}.<br><b>So today:</b> ${today}`}}
/* save this exercise as it goes (survives an interruption) */
function logEx(X){const k=X.k,e=EX[k],d=X.rows.filter(r=>r.done);const h=LS.get("hist",{});
 if(d.length){const old=h[k]&&h[k].sid===S.t0?null:h[k];
  if(old&&!X.prev)X.prev=old;
  h[k]={sid:S.t0,d:new Date().toISOString(),rounds:d.map(r=>({r:+r.r||0,w:r.w===""?null:r.w,band:r.band,sec:+r.sec||null,rate:r.rate||""})),reps:d.map(r=>e.t?(+r.sec||e.t):(+r.r||0)),w:e.w==="lb"?d[0].w:null,band:e.w==="band"?d[0].band:null};
  const P=LS.get("prog",{});P[k]=nextTarget(k,X.rows);LS.set("prog",P);
  const ev=LS.get("everDone",[]);if(!ev.includes(k)){ev.push(k);LS.set("everDone",ev)}}
 else if(h[k]&&h[k].sid===S.t0){if(X.prev)h[k]=X.prev;else delete h[k]}
 LS.set("hist",h);
 const last=d[d.length-1]||X.rows[0];if(e.w==="lb"&&last.w!==""&&last.w!=null)setW(k,last.w);if(e.w==="band")setBand(k,last.band)}

/* ===== exercise state: rows of rounds × reps × weight ===== */
function initEx(){const st=S.steps[S.i],k=curKey();S.exs=S.exs||{};let X=S.exs[S.i];
 if(X&&X.k===k)return X;
 const n=DAYS[S.day].slots[st.j].n,a=advice(k);
 X=S.exs[S.i]={k,adv:a.text,rows:Array.from({length:n},()=>({r:a.reps,w:a.w,band:a.band,sec:a.sec,done:false,rate:""}))};save();return X}
function curEx(){return S&&S.exs&&S.exs[S.i]}
function prefBar(k,ctx){const p=prefOf(k);return `<div class="prefs" data-k="${k}"><button class="${p==="more"?"on":""}" onclick="prefClick('${k}','more','${ctx}')">👍 More</button><button class="${p==="less"?"on":""}" onclick="prefClick('${k}','less','${ctx}')">👎 Less</button><button class="${p==="never"?"on no":""}" onclick="prefClick('${k}','never','${ctx}')">🚫 Never</button></div>`}
function prefClick(k,v,ctx){setPref(k,v);const now=prefOf(k);
 document.querySelectorAll(`.prefs[data-k="${k}"]`).forEach(el=>el.outerHTML=prefBar(k,ctx));
 if(now==="never"){toast("Hidden. It won't come back.");const m=ctx.match(/^ov:(\w):(\d+)$/);
  if(ctx==="run"&&S&&S.steps[S.i].t==="e")openReplace(S.day,S.steps[S.i].j,1);else if(m)openReplace(m[1],+m[2],0)}
 else toast(now==="more"?"You'll see it more often.":now==="less"?"You'll see it less often.":"Back to normal.")}
function toast(t){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el)}el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),1800)}
function exTop(k,n){const e=EX[k];return `<div class="row" style="align-items:flex-start"><div class="exname sp">${exName(k)}</div><button class="swap" style="margin-top:6px" onclick="openReplace(S.day,S.steps[S.i].j,1)" aria-label="Replace">⇄<span>Replace</span></button></div>
 <div class="chips"><span class="pill acc">${presc(k,n)}</span><span class="pill">${kneelOn(k)?e.kn.e:e.e}</span>${isNew(k)?'<span class="pill ok">✨ New</span>':""}${e.cm?CM_TAG:""}</div>${e.cmn&&!kneelOn(k)?`<div class="cmn">🦵 Knee-safe: ${e.cmn}</div>`:""}${kneelBar(k,"run")}
 <div class="mbox">${bodySVG(k)}<div class="mtxt"><div class="lbl" style="margin:0 0 4px">Works</div><div>${muscleText(k)}</div></div></div>
 <p class="cue">${exCue(k)}</p>${e.b?'<div class="heavy" style="margin-top:10px;background:rgba(139,124,246,.14);color:#B3A8FF">🪑 Keep one hand on support. Safety first.</div>':""}`}
function rowsHTML(k,X){const e=EX[k];
 const wl=e.w==="lb"?"lb":e.w==="band"?"Band":"";
 let h=`<div class="rhead"><span>Round</span><span>${e.t?"Seconds":"Reps"+(e.s?" / side":"")}</span><span>${wl}</span><span>Done</span></div>`;
 X.rows.forEach((r,i)=>{h+=`<div class="rrow ${r.done?"done":""}"><span class="rn">${i+1}</span>
  <input class="ri" inputmode="numeric" aria-label="${e.t?"Seconds":"Reps"} round ${i+1}" value="${e.t?r.sec:r.r}" onchange="setRow(${i},'${e.t?"sec":"r"}',this.value)">
  ${e.w==="lb"?`<input class="ri" inputmode="decimal" aria-label="Pounds round ${i+1}" placeholder="lb" value="${r.w??""}" onchange="setRow(${i},'w',this.value)">`:e.w==="band"?`<button class="ri bandb" onclick="cycleBand(${i})">${r.band}</button>`:`<span class="ri none">—</span>`}
  <button class="chk ${r.done?"on":""}" onclick="toggleRow(${i})" aria-label="Round ${i+1} done">✓</button></div>
  ${r.done?`<div class="rate" data-i="${i}"><span class="muted small">Felt:</span>${RATES.map(x=>`<button class="${r.rate===x?"on "+x:""}" onclick="rateRow(${i},'${x}')">${x}</button>`).join("")}</div>`:""}`});
 return h}
function guideHTML(X){return `<div class="last" style="margin-top:12px">${X.adv}</div>`}
function drawRows(){const X=curEx();const el=$("#rows");if(X&&el)el.innerHTML=rowsHTML(X.k,X);drawDock()}
function drawDock(){const X=curEx();if(!X)return;const e=EX[X.k],idx=X.rows.findIndex(r=>!r.done);
 if(idx<0)dock(`<button class="btn pri" onclick="nextStep()">Next ›</button>`);
 else if(e.t)dock(`<div class="ctrls"><button class="btn sec side" onclick="prevStep()" aria-label="Back">‹</button><button class="btn pri" id="pp" onclick="ppTimed()">${T&&!T.rest?(T.paused?"▶ Resume":"Pause"):"▶ Start round "+(idx+1)}</button><button class="btn sec side" onclick="nextStep()" aria-label="Skip">›</button></div>`);
 else dock(`<button class="btn ok" onclick="checkNext()">✓ Round ${idx+1} of ${X.rows.length} done</button>`)}
function setRow(i,f,v){const X=curEx();if(!X)return;const val=v===""?"":Math.max(0,parseFloat(v)||0);X.rows[i][f]=val;
 if(f==="w"||f==="sec"){for(let j=i+1;j<X.rows.length;j++)if(!X.rows[j].done)X.rows[j][f]=val;if(f==="w")setW(X.k,val)}
 if(X.rows[i].done)logEx(X);save();drawRows()}
function cycleBand(i){const X=curEx();const r=X.rows[i];r.band=BANDS[(BANDS.indexOf(r.band)+1)%3];for(let j=i+1;j<X.rows.length;j++)if(!X.rows[j].done)X.rows[j].band=r.band;setBand(X.k,r.band);if(r.done)logEx(X);save();drawRows()}
function addRound(d){const X=curEx();if(d>0){const l=X.rows[X.rows.length-1];X.rows.push({...l,done:false,rate:""})}else{if(X.rows.length>1&&!X.rows[X.rows.length-1].done)X.rows.pop()}save();drawRows()}
function rateRow(i,x){const X=curEx();X.rows[i].rate=X.rows[i].rate===x?"":x;logEx(X);save();drawRows();
 document.querySelectorAll("#rest .rate button").forEach(b=>b.className=X.rows[i].rate===b.textContent?"on "+b.textContent:"")}
function checkNext(){const X=curEx();const i=X.rows.findIndex(r=>!r.done);if(i>=0)toggleRow(i)}
function toggleRow(i){unlock();const X=curEx();const r=X.rows[i];
 document.querySelectorAll("#rows input").forEach(el=>el.blur());
 r.done=!r.done;S.sets+=r.done?1:-1;if(!r.done)r.rate="";logEx(X);save();drawRows();
 if(r.done){buzz(40);stopTimer();const all=X.rows.every(x=>x.done),nx=X.rows.findIndex(x=>!x.done);
  rest(all?nextLabel():`Round ${nx+1} of ${X.rows.length} · ${EX[X.k].n}`,i,()=>{if(X.rows.every(x=>x.done)){S.i++;const n=S.steps[S.i];S.auto=!!(n&&n.t==="s")}show()})}}

/* rep-based exercise */
function showRepEx(st,k){const X=initEx(),[lo,hi]=repRange(k);
 $("#body").innerHTML=`${exTop(k,X.rows.length)}${guideHTML(X)}
 <div class="card rounds" id="rows" style="margin-top:12px"></div>
 <div class="row" style="margin-top:6px"><button class="btn ghost" onclick="addRound(-1)">− Round</button><button class="btn ghost" onclick="addRound(1)">+ Round</button></div>
 <div class="tip" style="justify-content:center">💪 <span>Go a little heavier when ${hi} reps feels easy.</span></div>
 ${prefBar(k,"run")}
 <div class="row" style="margin-top:4px"><button class="btn ghost" onclick="prevStep()">‹ Back</button><button class="btn ghost" onclick="nextStep()">Skip ›</button></div>
 <div style="margin-top:6px">${KNEE}</div>`;drawRows()}

/* timed exercise (planks, carries, balance holds) */
function showTimedEx(st,k){const X=initEx(),e=EX[k];
 $("#body").innerHTML=`${exTop(k,X.rows.length)}${guideHTML(X)}
 <div class="ringbox">${ringSVG("rg")}<div class="ringtxt"><div><div class="big" id="rt">${(X.rows.find(r=>!r.done)||X.rows[0]).sec}</div><div class="sm" id="rs">Tap Start</div></div></div></div>
 <div class="card rounds" id="rows"></div>
 <div class="row" style="margin-top:6px"><button class="btn ghost" onclick="addRound(-1)">− Round</button><button class="btn ghost" onclick="addRound(1)">+ Round</button></div>
 ${prefBar(k,"run")}
 <div style="margin-top:6px">${KNEE}</div>`;drawRows()}
function ppTimed(){unlock();const X=curEx(),k=X.k,e=EX[k],i=X.rows.findIndex(r=>!r.done);if(i<0)return;
 if(T&&!T.rest){if(T.paused){resumeTimer();$("#pp").textContent="Pause"}else{pauseTimer();$("#pp").textContent="▶ Resume"}return}
 const sec=+X.rows[i].sec||e.t;$("#pp").textContent="Pause";let switched=false;const rb=$(".ringbox");rb&&rb.scrollIntoView({block:"center",behavior:"smooth"});
 runTimer(3,{tick:r=>{$("#rt")&&($("#rt").textContent=mmss(r));$("#rs")&&($("#rs").textContent="Get ready");setRing("rg",r/3)},done:()=>{beepTick();
  runTimer(sec,{ticks:true,tick:(r,tot)=>{if(!$("#rt"))return;$("#rt").textContent=mmss(r);setRing("rg",r/tot);if(e.s&&!switched&&r<=tot/2){switched=true;beepSwitch()}
   $("#rs").textContent=e.s?(r>tot/2?"Side 1":"Switch side → 2"):"Hold · breathe"},done:()=>{beepEnd();X.rows[i].sec=sec;toggleRow(i)}})}})}

/* ===== rest timer: her length (default 60 s), −10/+10, pause, skip, beeps ===== */
function rest(nextTxt,ri,after){const sec=restLen(),X=curEx(),r=X&&ri!=null?X.rows[ri]:null;
 const el=$("#rest");el.innerHTML=`<div class="in"><div class="phase">Rest</div><div class="ringbox" style="margin:10px 0">${ringSVG("rr",105)}<div class="ringtxt"><div><div class="big" id="rrt">${mmss(sec)}</div><div class="sm" id="rrs">seconds</div></div></div></div>
 <div class="ctrls3"><button class="btn sec" onclick="restAdj(-10)">−10</button><button class="btn sec" id="rpp" onclick="restPP()">Pause</button><button class="btn sec" onclick="restAdj(10)">+10</button></div>
 <div class="muted small" style="margin-top:8px">Your rest: <b id="rlen">${sec}</b> s</div>
 ${r?`<div class="rate big" style="margin-top:14px"><span class="muted">Round ${ri+1} felt:</span>${RATES.map(x=>`<button class="${r.rate===x?"on "+x:""}" onclick="rateRow(${ri},'${x}')">${x}</button>`).join("")}</div>`:""}
 <div class="nextup"><div class="lbl" style="margin:0 0 4px">Next</div><div style="font-weight:700;font-size:17px">${nextTxt}</div></div>
 <button class="btn pri" style="margin-top:14px" onclick="endRest()">Skip rest ›</button>
 <p class="muted small" style="margin-top:12px">💧 Sip water. Breathe slowly.</p></div>`;
 el.classList.add("on");el._after=after;
 runTimer(sec,{rest:true,ticks:true,tick:(r,tot)=>{const t=$("#rrt");if(t)t.textContent=mmss(r);setRing("rr",Math.max(0,r/tot))},done:()=>{beepEnd();endRest()}});
}
function restAdj(d){if(!T||!T.rest)return;const rem=T.paused?T.rem/1000:(T.end-Date.now())/1000;
 LS.set("restLen",Math.min(180,Math.max(10,restLen()+d)));const l=$("#rlen");if(l)l.textContent=restLen();
 if(rem+d<=0.5){endRest();return}addTime(d)}
function restPP(){if(!T||!T.rest)return;if(T.paused){resumeTimer();$("#rpp").textContent="Pause";$("#rrs").textContent="seconds"}else{pauseTimer();$("#rpp").textContent="▶ Resume";$("#rrs").textContent="paused"}}
function endRest(){stopTimer();hideRest();const a=$("#rest")._after;$("#rest")._after=null;a&&a()}
function hideRest(){$("#rest").classList.remove("on")}

/* ===== Replace sheet: 3-5 moves for the same muscles ===== */
function openReplace(day,j,inRun){const cur=pick(day,j),list=altsFor(day,j);
 $("#sheetPane").innerHTML=`<div class="grab"></div><div class="exname">Replace this move</div>
 <div class="muted" style="margin-top:4px">${EX[cur].n} · works ${musclesOf(cur)[0].map(m=>MNAME[m]).join(", ")}</div>
 <div class="stack" style="margin-top:14px">${list.map(k=>`<button class="altitem" onclick="pickAlt('${day}',${j},'${k}',${inRun?1:0})">${bodySVG(k,"mthumb")}<div class="sp"><div class="n">${exName(k)}${EX[k].fav?" ⭐":""}${EX[k].cm?" 💪":""}${isNew(k)?' <span class="pill ok" style="padding:2px 8px;font-size:11px">NEW</span>':""}</div><div class="m">${musclesOf(k)[0].map(m=>MNAME[m]).join(" · ")} · ${EX[k].e||""}</div></div><span class="chev">›</span></button>`).join("")}</div>
 <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="openReplace('${day}',${j},${inRun?1:0})">↻ Show others</button><button class="btn sec" onclick="closeSheet()">Keep it</button></div>`;
 $("#sheet").classList.add("on")}
function pickAlt(day,j,k,inRun){replaceSlot(day,j,k);closeSheet();toast("Replaced with "+EX[k].n);
 if(inRun&&S){stopTimer();if(S.exs)delete S.exs[S.i];S._pos=null;$("#vid").dataset.k="";show()}else overview(day)}
function hiddenSheet(){const p=LS.get("pref",{}),ks=Object.keys(p).filter(k=>p[k]==="never"&&EX[k]);
 $("#sheetPane").innerHTML=`<div class="grab"></div><div class="exname">Hidden moves</div><div class="stack" style="margin-top:12px">${ks.length?ks.map(k=>`<div class="altitem">${bodySVG(k,"mthumb")}<div class="sp"><div class="n">${EX[k].n}</div></div><button class="pill acc" style="min-height:40px" onclick="setPref('${k}','never');hiddenSheet()">Bring back</button></div>`).join(""):'<p class="muted">None.</p>'}</div>
 <div style="margin-top:14px"><button class="btn sec" onclick="closeSheet();home()">Close</button></div>`;$("#sheet").classList.add("on")}

/* finish: save history so next time the app picks different moves */
function finish(){stopTimer();const day=S.day,mins=Math.max(1,Math.round((Date.now()-S.t0)/60000)),sets=S.sets;
 const p=getPlan(day),all=p.b.concat(p.w.map(x=>x[0]),p.c.map(x=>x[0])).filter(k=>k!=="march"&&k!=="breathing");
 const r=LS.get("recent",{});r[day]=[p.b].concat(r[day]||[]).slice(0,2);LS.set("recent",r);
 LS.set("recentAll",[all].concat(LS.get("recentAll",[])).slice(0,2));
 const P=LS.get("plans",{});delete P[day];LS.set("plans",P);
 const done=LS.get("done",{});done[day]=new Date().toISOString();LS.set("done",done);
 const ses=LS.get("sessions",[]);ses.push({day,d:new Date().toISOString(),mins,sets,ex:p.b});LS.set("sessions",ses.slice(-200));LS.set("run",null);
 try{wake&&wake.release()}catch(e){}
 $("#app").innerHTML=`<div class="wrap center"><div class="done-emoji">🎉</div><h1>Great job, Valerie!</h1><p class="muted">Day ${day} · ${DAYS[day].t} is done.</p>
 <div class="row" style="margin:22px 0"><div class="stat"><b>${mins}</b><span class="muted small">minutes</span></div><div class="stat"><b>${sets}</b><span class="muted small">sets</span></div><div class="stat"><b>${Math.min(4,weekCount())}/4</b><span class="muted small">this week</span></div></div>
 <div class="card" style="text-align:left"><div class="tip">✨ <span>Next Day ${day} will have <b>new moves</b>.</span></div><div class="tip">🍳 <span><b>Eat protein</b> with your next meal.</span></div><div class="tip">💧 <span>Drink some water.</span></div></div>
 <div style="margin-top:18px"><button class="btn pri" onclick="home()">Back home</button></div></div>`;S=null}

home();
</script></body></html>
