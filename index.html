<title>Valerie's Workout</title>
<style>
:root{
  --bg:#0E1116;--card:#171B23;--card2:#1E2330;--line:rgba(255,255,255,.07);
  --text:#F3F5F9;--muted:#99A2B3;--dim:#6B7385;
  --acc:#FF7A59;--acc2:#FF9F7A;--ok:#3DD6B5;--warn:#F5B544;
  --A:#FF7A59;--B:#3DD6B5;--C:#8B7CF6;--D:#F5B544;
  --r:20px;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
a{color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:calc(var(--safeT) + 18px) 18px calc(var(--safeB) + 110px)}
h1{font-size:30px;line-height:1.1;margin:4px 0 4px;letter-spacing:-.02em}
h2{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack>*+*{margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card2);font-size:13px;color:var(--muted);font-weight:600}
.pill.acc{background:rgba(255,122,89,.15);color:var(--acc2)}
.pill.ok{background:rgba(61,214,181,.14);color:var(--ok)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;border-radius:18px;font-weight:700;font-size:18px;padding:0 20px;width:100%}
.btn.pri{background:linear-gradient(135deg,var(--acc),#F05A8C);color:#fff;box-shadow:0 8px 24px rgba(255,100,100,.25)}
.btn.ok{background:linear-gradient(135deg,#2EC4A6,#3DD6B5);color:#07211b}
.btn.sec{background:var(--card2);color:var(--text)}
.btn.ghost{background:transparent;color:var(--muted);min-height:48px;font-size:16px}
.btn:active{transform:scale(.98)}
.icon-btn{width:46px;height:46px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.knee{display:flex;gap:10px;align-items:center;background:rgba(245,181,68,.12);color:#F7C766;border-radius:14px;padding:11px 14px;font-weight:600;font-size:15px}
.tip{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted);padding:6px 0}
.tip b{color:var(--text);font-weight:600}
/* home */
.hello{margin:6px 0 18px}
.week{display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:6px}.dots i{width:28px;height:8px;border-radius:9px;background:var(--card2)}.dots i.on{background:var(--ok)}
.day{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);width:100%;text-align:left;min-height:92px;position:relative}
.day:active{transform:scale(.99)}
.badge{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:24px;color:#0E1116;flex:none}
.day .t{font-weight:700;font-size:18px}
.day .s{font-size:14px;color:var(--muted);margin-top:2px}
.day .l{font-size:13px;margin-top:6px;color:var(--dim)}
.day .l.done{color:var(--ok)}
.next{position:absolute;top:12px;right:12px}
.chev{color:var(--dim);font-size:22px}
/* overview */
.sec-t{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:22px 4px 10px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.thumb{width:84px;height:56px;border-radius:12px;background:#000 center/cover;flex:none;position:relative}
.thumb:after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:14px;text-shadow:0 1px 6px #000}
.item .n{font-weight:650;font-size:16px;line-height:1.2}
.item .m{font-size:13px;color:var(--muted);margin-top:3px}
.swap{min-width:52px;height:46px;border-radius:14px;background:var(--card2);font-size:13px;font-weight:700;color:var(--acc2);display:grid;place-items:center;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(var(--safeB) + 14px);background:linear-gradient(to top,var(--bg) 70%,rgba(14,17,22,0));z-index:5}
.bottom .in{max-width:520px;margin:0 auto}
/* run */
.prog{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#F05A8C);border-radius:9px;transition:width .4s}
.phase{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc2)}
.video{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000 center/cover;border:1px solid var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);text-decoration:none;padding:10px 2px}
.exname{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.15;margin:4px 0 8px}
.cue{font-size:16px;line-height:1.45;color:#CDD3DE;margin:10px 0 0}
.sets{display:flex;gap:8px}
.sets i{flex:1;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--dim);font-size:15px}
.sets i.cur{background:rgba(255,122,89,.16);color:var(--acc2);outline:2px solid rgba(255,122,89,.5)}
.sets i.done{background:rgba(61,214,181,.15);color:var(--ok)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:56px;height:56px;border-radius:16px;background:var(--card2);font-size:26px;font-weight:600;flex:none}
.stepper .val{flex:1;text-align:center}
.stepper input{width:100%;background:transparent;border:0;color:var(--text);font-size:30px;font-weight:750;text-align:center;font-family:inherit;outline:none;padding:0}
.stepper .u{font-size:13px;color:var(--muted);margin-top:-2px}
.lbl{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.seg{display:flex;gap:8px}.seg button{flex:1;height:50px;border-radius:14px;background:var(--card2);font-weight:650;color:var(--muted)}
.seg button.on{background:rgba(255,122,89,.18);color:var(--acc2);outline:2px solid rgba(255,122,89,.45)}
.heavy{background:rgba(61,214,181,.12);color:var(--ok);border-radius:14px;padding:11px 14px;font-weight:650;font-size:15px}
.last{font-size:14px;color:var(--muted)}
.ringbox{display:grid;place-items:center;margin:8px 0 4px;position:relative}
.ring{width:190px;height:190px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--card2)}.ring .fg{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ringtxt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringtxt .big{font-size:52px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ringtxt .sm{font-size:14px;color:var(--muted);font-weight:600;margin-top:-4px}
.ctrls{display:flex;gap:10px}.ctrls .btn{flex:1}
.ctrls .side{flex:0 0 76px}
function dock(h){const d=$("#dockin");if(d)d.innerHTML=h}
/* rest overlay */
#rest{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--safeT) + 20px) 22px calc(var(--safeB) + 24px)}
#rest.on{display:flex}
#rest .in{width:100%;max-width:420px;text-align:center}
#rest .ring{width:250px;height:250px}
#rest .ringtxt .big{font-size:68px}
.nextup{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;margin-top:18px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .pane{width:100%;max-width:520px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px 18px calc(var(--safeB) + 18px);max-height:92vh;overflow:auto}
.grab{width:44px;height:5px;border-radius:9px;background:var(--card2);margin:0 auto 14px}
.toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:16px}
.sw{width:50px;height:30px;border-radius:20px;background:var(--card2);position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on:after{left:23px}
.center{text-align:center}
.done-emoji{font-size:72px;margin:30px 0 6px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px}
</style>
</head>

 A:{t:"Upper · Push",s:"Chest, shoulders, triceps",col:"var(--A)",z:"up",slots:[

/* ===== storage & helpers ===== */
const LS={get(k,d){try{const v=localStorage.getItem("vw_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("vw_"+k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const fmtDate=iso=>new Date(iso).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const daysAgo=iso=>{const a=new Date(iso);a.setHours(0,0,0,0);const b=new Date();b.setHours(0,0,0,0);return Math.round((b-a)/864e5)};
const mmss=s=>{s=Math.max(0,Math.ceil(s));return s>=60?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):String(s)};
const thumb=id=>`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const watch=id=>`https://www.youtube.com/watch?v=${id}`;
const embed=id=>`https://www.youtube-nocookie.com/embed/${id}?rel=0&playsinline=1&modestbranding=1`;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function presc(k,n){const e=EX[k];if(e.t){return `${n} × ${e.s?Math.round(e.t/2)+" s each side":e.t+" s"}`}return `${n} × ${e.r||"8-12"}${e.s?" each side":""}`}
function repRange(k){return (EX[k].r||"8-12").split("-").map(Number)}

/* ===== automatic workout generator =====
   - every slot has a type (e.g. "upper push", "balance"); the app picks a fresh exercise of that type
   - it avoids anything done in the last 2 sessions of the same day, and in the last 2 workouts of any day
   - it avoids two moves of the same family (e.g. two flys) in one workout
   - it keeps the main part near 20 minutes */
function pool(slot){return Object.keys(EX).filter(k=>EX[k].g===slot.g&&(!slot.f||slot.f.includes(EX[k].f)))}
function recentSet(day){const s=new Set();const r=LS.get("recent",{});(r[day]||[]).slice(0,2).forEach(a=>a.forEach(k=>s.add(k)));LS.get("recentAll",[]).slice(0,2).forEach(a=>a.forEach(k=>s.add(k)));return s}
function choose(cands,used,fams,avoid){
 const tiers=[k=>!used.has(k)&&!avoid.has(k)&&!fams.has(EX[k].g+EX[k].f),k=>!used.has(k)&&!avoid.has(k),k=>!used.has(k)&&!fams.has(EX[k].g+EX[k].f),k=>!used.has(k)];
 for(const t of tiers){const c=cands.filter(t);if(c.length)return rnd(c)}return rnd(cands)}
function setSecs(k){const e=EX[k];if(e.t)return e.t;const [lo,hi]=repRange(k);return ((lo+hi)/2)*3*(e.s?2:1)+5}
function mainSecs(day,b){return DAYS[day].slots.reduce((a,sl,j)=>a+sl.n*(setSecs(b[j])+sl.rest),0)}
function genBlocks(day,extraAvoid){
 const avoid=recentSet(day);(extraAvoid||[]).forEach(k=>avoid.add(k));
 let best=null,bestD=1e9;
 for(let tries=0;tries<80;tries++){
  const used=new Set(),fams=new Set(),b=[];
  DAYS[day].slots.forEach(sl=>{const k=choose(pool(sl),used,fams,avoid);b.push(k);used.add(k);fams.add(EX[k].g+EX[k].f)});
  const m=mainSecs(day,b)/60,d=m<17?17-m:m>21?m-21:0;
  if(d<bestD){best=b;bestD=d}if(d===0)break}
 return best}
function stretchPool(g,z){return Object.keys(EX).filter(k=>EX[k].g===g&&(EX[k].z===z||EX[k].z==="any")).concat(g==="warm"?WARM_EXTRA[z]:[])}
function genStretches(g,z,avoid){
 const first=g==="warm"?"march":null,last=g==="cool"?"breathing":null;
 let p=stretchPool(g,z).filter(k=>k!==first&&k!==last);
 let fresh=shuffle(p.filter(k=>!avoid.has(k))),old=shuffle(p.filter(k=>avoid.has(k)));
 let pick=fresh.concat(old).slice(0,6);
 pick.sort((a,b)=>(EX[a].pos||0)-(EX[b].pos||0));
 if(first)pick.unshift(first);if(last)pick.push(last);
 return pick.map(k=>[k,EX[k].s?40:35])}
function generate(day,extraAvoid){
 const D=DAYS[day],avoid=recentSet(day);(extraAvoid||[]).forEach(k=>avoid.add(k));
 return {b:genBlocks(day,extraAvoid),w:genStretches("warm",D.z,avoid),c:genStretches("cool",D.z,avoid),at:new Date().toISOString()}}
function validPlan(day,p){return p&&p.b&&p.b.length===DAYS[day].slots.length&&p.b.every(k=>EX[k])&&p.w.every(x=>EX[x[0]])&&p.c.every(x=>EX[x[0]])}
function getPlan(day){const P=LS.get("plans",{});if(!validPlan(day,P[day])){P[day]=generate(day);LS.set("plans",P)}return P[day]}
function savePlan(day,p){const P=LS.get("plans",{});P[day]=p;LS.set("plans",P)}
function refreshPlan(day){const old=getPlan(day);const keep=old.b.concat(old.w.map(x=>x[0]),old.c.map(x=>x[0]));savePlan(day,generate(day,keep.filter(k=>k!=="march"&&k!=="breathing")))}
function swapSlot(day,j){const p=getPlan(day),sl=DAYS[day].slots[j];const used=new Set(p.b),fams=new Set(p.b.filter((_,i)=>i!==j).map(k=>EX[k].g+EX[k].f));
 const c=pool(sl).filter(k=>k!==p.b[j]);p.b[j]=choose(c,used,fams,recentSet(day));savePlan(day,p)}
function pick(day,j){return getPlan(day).b[j]}
function estMin(day){const p=getPlan(day);const st=a=>a.reduce((s,x)=>s+x[1]+3,0);return Math.round((st(p.w)+st(p.c)+mainSecs(day,p.b))/60)}
function isNew(k){return !LS.get("hist",{})[k]&&!(LS.get("everDone",[])).includes(k)}

let AC=null;
function unlock(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()}if(AC.state==="suspended")AC.resume()}catch(e){}}
document.addEventListener("touchend",unlock,{passive:true});document.addEventListener("click",unlock);
function tone(f,d,w=0,vol=.3){if(!AC||!LS.get("sound",true))return;const t=AC.currentTime+w,o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function beepTick(){tone(660,.09,0,.18)}
function beepEnd(){tone(880,.16);tone(880,.16,.22);tone(1320,.45,.44);buzz([250,120,250])}
function beepSwitch(){tone(990,.12);tone(990,.12,.18);buzz([120,80,120])}
let wake=null;
async function keepAwake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S)keepAwake()});

/* ===== timer engine (timestamp based) ===== */
let T=null;
function runTimer(sec,o){T={end:Date.now()+sec*1000,total:sec,paused:false,rem:sec*1000,last:Math.ceil(sec),...o};o.tick&&o.tick(sec,sec)}
function pauseTimer(){if(T&&!T.paused){T.paused=true;T.rem=T.end-Date.now()}}
function resumeTimer(){if(T&&T.paused){T.paused=false;T.end=Date.now()+T.rem}}
function addTime(s){if(!T)return;if(T.paused)T.rem+=s*1000;else T.end+=s*1000;T.total+=s}
function stopTimer(){T=null}
setInterval(()=>{if(!T||T.paused)return;const rem=(T.end-Date.now())/1000;const whole=Math.ceil(rem);
 if(whole!==T.last){T.last=whole;if(T.ticks&&whole<=3&&whole>0)beepTick()}
 T.tick&&T.tick(rem,T.total);if(rem<=0){const d=T.done;T=null;d&&d()}},200);
function ringSVG(id,r=95){const c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 ${2*r+20} ${2*r+20}"><circle class="bg" cx="${r+10}" cy="${r+10}" r="${r}"/><circle id="${id}" class="fg" cx="${r+10}" cy="${r+10}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="0"/></svg>`}
function setRing(id,frac){const el=document.getElementById(id);if(!el)return;const c=+el.getAttribute("stroke-dasharray");el.style.strokeDashoffset=c*(1-Math.max(0,Math.min(1,frac)))}

function nextUp(){const ses=LS.get("sessions",[]);if(!ses.length)return "A";const l=ses[ses.length-1].day;return ORDER[(ORDER.indexOf(l)+1)%4]}
function home(){
 S=null;stopTimer();hideRest();
 const done=LS.get("done",{}),wc=Math.min(4,weekCount()),nu=nextUp(),saved=LS.get("run",null);

 h+=`</div><div class="sec-t">Tips</div><div class="card">${KNEE}

 const nb=D.slots.filter(s=>s.g==="bal").length,ns=D.slots.length-nb,wt=LS.get("wt",{});

 let last="";
 D.slots.forEach((sl,j)=>{const k=p.b[j],e=EX[k],sec=sl.g==="bal"?"Balance · hold support":"Workout · about 20 min";
  if(sec!==last)h+=`${last?"</div>":""}<div class="sec-t">${sec}</div><div class="stack">`;last=sec;
  const w=wt[k];
  h+=`<div class="item"><button class="thumb" style="background-image:url(${thumb(e.v)})" onclick="preview('${k}')" aria-label="Watch"></button><button class="sp" style="text-align:left" onclick="preview('${k}')"><div class="n">${e.n}${isNew(k)?' <span class="pill ok" style="padding:2px 8px;font-size:11px;vertical-align:2px">NEW</span>':""}</div><div class="m">${presc(k,sl.n)}${w&&e.w==="lb"?" · "+w+" lb":""} · ${GROUP_NAME[e.g]}</div></button><button class="swap" onclick="swapSlot('${day}',${j});overview('${day}')" aria-label="Swap">⇄</button></div>`});
 h+=`</div><div class="sec-t">Cool-down · 5 min</div><div class="chips">${p.c.map(([k])=>`<button class="chip" onclick="preview('${k}')">${EX[k].n}</button>`).join("")}</div>

 $("#app").innerHTML=h;

function buildSteps(day){const p=getPlan(day);return [
 ...p.w.map(([k,sec])=>({t:"s",k,sec,ph:"Warm-up"})),
 ...DAYS[day].slots.map((b,j)=>({t:"e",j,ph:"Workout"})),
 ...p.c.map(([k,sec])=>({t:"s",k,sec,ph:"Cool-down"}))]}
function start(day){unlock();S={day,steps:buildSteps(day),i:0,set:0,auto:false,reps:[],t0:Date.now(),sets:0};save();keepAwake();shell();show()}
function resume(){const r=LS.get("run",null);if(!r)return home();unlock();S=r;S.auto=false;S._pos=null;keepAwake();shell();show()}
function save(){if(S){S.ts=Date.now();LS.set("run",S)}}
function quit(){if(confirm("Stop this workout?")){LS.set("run",null);home()}}
function units(st){return st.t==="s"?1:DAYS[S.day].slots[st.j].n}
function progress(){let tot=0,done=0;S.steps.forEach((st,i)=>{const u=units(st);tot+=u;if(i<S.i)done+=u;else if(i===S.i&&st.t==="e")done+=S.set});return done/tot}
function shell(){
 $("#app").innerHTML=`<div class="wrap" style="padding-bottom:calc(var(--safeB) + 120px)"><div class="top"><button class="icon-btn" onclick="quit()" aria-label="Close">✕</button><div class="prog"><i id="pbar"></i></div><span class="muted small" id="pnum" style="min-width:36px;text-align:right"></span></div>
 <div class="phase" id="phase"></div><div style="height:10px"></div><div class="video" id="vid"></div><a class="yt" id="ytl" target="_blank" rel="noopener">▶ Watch on YouTube ↗</a><div id="body"></div></div><div class="bottom" id="dock"><div class="in" id="dockin"></div></div>`}
function setVideo(id,name){const v=$("#vid");if(v.dataset.id===id)return;v.dataset.id=id;v.style.backgroundImage=`url(https://i.ytimg.com/vi/${id}/hqdefault.jpg)`;
 v.innerHTML=`<iframe src="${embed(id)}" title="${name}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;$("#ytl").href=watch(id)}
function phaseInfo(){const st=S.steps[S.i];const same=S.steps.filter(x=>x.ph===st.ph);return `${st.ph} · ${same.indexOf(st)+1} of ${same.length}`}
function curKey(){const st=S.steps[S.i];return st.t==="s"?st.k:pick(S.day,st.j)}
function show(){
 if(S.i>=S.steps.length)return finish();
 const st=S.steps[S.i];const pos=S.i+"."+S.set;if(S._pos!==pos){S._pos=pos;window.scrollTo(0,0)}
 const p=progress();$("#pbar").style.width=(p*100).toFixed(1)+"%";$("#pnum").textContent=Math.round(p*100)+"%";
 $("#phase").textContent=phaseInfo();const k=curKey();setVideo(EX[k].v,EX[k].n);
 if(st.t==="s")showStretch(st);else if(EX[k].t)showTimedEx(st,k);else showRepEx(st,k);
 save();
}
function nextLabel(){const n=S.steps[S.i+1];if(!n)return "Finish 🎉";const k=n.t==="s"?n.k:pick(S.day,n.j);return (n.ph!==S.steps[S.i].ph?n.ph+": ":"")+EX[k].n}
function dock(h){const d=$("#dockin");if(d)d.innerHTML=h}

/* stretch: timed, auto-advance */
function showStretch(st){const e=EX[st.k];
 $("#body").innerHTML=`<div class="exname">${e.n}</div><div class="chips"><span class="pill">${st.sec} s${e.s?" · both sides":""}</span></div><p class="cue">${e.c}</p>
 <div class="ringbox">${ringSVG("rg")}<div class="ringtxt"><div><div class="big" id="rt">${st.sec}</div><div class="sm" id="rs">${S.auto?"Get ready":"Tap Start"}</div></div></div></div>
 <p class="muted small center" style="margin:6px 0 0">Next: ${nextLabel()}</p>
 ${S.i===0?`<button class="btn ghost" onclick="skipPhase()">Skip warm-up</button>`:st.ph==="Cool-down"?`<button class="btn ghost" onclick="skipPhase()">Skip cool-down</button>`:""}
 <div style="margin-top:12px">${KNEE}</div>`;
 dock(`<div class="ctrls"><button class="btn sec side" onclick="prevStep()" aria-label="Back">‹</button><button class="btn pri" id="pp" onclick="ppStretch()">${S.auto?"Pause":"▶ Start"}</button><button class="btn sec side" onclick="nextStep()" aria-label="Skip">›</button></div>`);
 stopTimer();if(S.auto)go();
}
function go(){const st=S.steps[S.i],e=EX[st.k];let switched=false;
 runTimer(3,{tick:r=>{$("#rt")&&($("#rt").textContent=mmss(r));$("#rs")&&($("#rs").textContent="Get ready");setRing("rg",r/3)},done:()=>{beepTick();
  runTimer(st.sec,{ticks:true,tick:(r,tot)=>{if($("#rt"))$("#rt").textContent=mmss(r);setRing("rg",r/tot);
   if(e.s&&!switched&&r<=tot/2){switched=true;beepSwitch()}
   if($("#rs"))$("#rs").textContent=e.s?(r>tot/2?"Side 1":"Switch side → 2"):(st.ph==="Warm-up"?"Keep moving":"Relax · breathe")},
   done:()=>{beepEnd();S.i++;const n=S.steps[S.i];if(n&&n.t==="s"&&n.ph===st.ph){show()}else{S.auto=false;show()}}})}});
}
function ppStretch(){unlock();if(!S.auto){S.auto=true;$("#pp").textContent="Pause";go();return}
 if(T&&T.paused){resumeTimer();$("#pp").textContent="Pause"}else{pauseTimer();$("#pp").textContent="▶ Resume"}}
function prevStep(){stopTimer();if(S.i>0){S.i--;S.set=0;S.reps=[]}show()}
function nextStep(){stopTimer();S.i++;S.set=0;S.reps=[];const n=S.steps[S.i];if(!n||n.t!=="s")S.auto=false;show()}
function skipPhase(){stopTimer();const ph=S.steps[S.i].ph;while(S.i<S.steps.length&&S.steps[S.i].ph===ph)S.i++;S.set=0;S.auto=false;show()}

/* rep-based exercise */
function lastLog(k){return LS.get("hist",{})[k]}
function weightBox(k,e){const wt=LS.get("wt",{})[k];return `<div><div class="lbl">Weight${e.s||/Dumbbells|kettlebells/i.test(e.e)?" (each hand)":""}</div><div class="stepper"><button onclick="bumpW('${k}',-1)">−</button><div class="val"><input id="wt" inputmode="decimal" placeholder="0" value="${wt??""}" onchange="setW('${k}',this.value)"><div class="u">lb</div></div><button onclick="bumpW('${k}',1)">+</button></div></div>`}
function showRepEx(st,k){const e=EX[k],b=DAYS[S.day].slots[st.j],[lo,hi]=repRange(k),last=lastLog(k);
 const band=LS.get("band",{})[k]||"Medium";
 if(S.reps.length!==S.set)S.reps=S.reps.slice(0,S.set);
 const def=(last&&last.reps&&last.reps[S.set])||Math.round((lo+hi)/2);
 const ready=last&&last.reps&&last.reps.length>=b.n&&last.reps.every(r=>r>=hi);
 let h=`<div class="row" style="align-items:flex-start"><div class="exname sp">${e.n}</div><button class="swap" style="margin-top:6px" onclick="swapRun()" aria-label="Swap">⇄</button></div>
 <div class="chips"><span class="pill acc">${presc(k,b.n)}</span><span class="pill">${e.e}</span>${isNew(k)?'<span class="pill ok">✨ New</span>':""}</div><p class="cue">${e.c}</p>`;
 if(last)h+=`<div class="last" style="margin-top:12px">Last time (${fmtDate(last.d)}): ${last.w?last.w+" lb · ":last.band?last.band+" band · ":""}${last.reps.join(", ")} reps</div>`;
 if(ready)h+=`<div class="heavy" style="margin-top:10px">💪 ${hi} reps felt easy last time. ${e.w==="lb"?"Try a little heavier today!":e.w==="band"?"Try a stronger band today!":"Try slower reps today!"}</div>`;
 h+=`<div class="card stack" style="margin-top:14px">`;
 if(e.w==="lb")h+=weightBox(k,e);
 if(e.w==="band")h+=`<div><div class="lbl">Band</div><div class="seg">${["Light","Medium","Heavy"].map(x=>`<button class="${x===band?"on":""}" onclick="setBand('${k}','${x}')">${x}</button>`).join("")}</div></div>`;
 h+=`<div><div class="lbl">Sets</div><div class="sets">${Array.from({length:b.n},(_,i)=>`<i class="${i<S.set?"done":i===S.set?"cur":""}">${i<S.set?"✓ "+(S.reps[i]??""):"Set "+(i+1)}</i>`).join("")}</div></div>
 <div><div class="lbl">Reps done${e.s?" (each side)":""}</div><div class="stepper"><button onclick="bumpR(-1)">−</button><div class="val"><input id="reps" inputmode="numeric" value="${def}"><div class="u">goal ${lo}-${hi}</div></div><button onclick="bumpR(1)">+</button></div></div></div>
 <div class="row" style="margin-top:4px"><button class="btn ghost" onclick="prevStep()">‹ Back</button><button class="btn ghost" onclick="nextStep()">Skip ›</button></div>
 <div class="tip" style="justify-content:center">💪 <span>Go a little heavier when ${hi} reps feels easy.</span></div>
 <div style="margin-top:6px">${KNEE}</div>`;
 $("#body").innerHTML=h;dock(`<button class="btn ok" onclick="doneSet()">✓ Done set ${S.set+1} of ${b.n}</button>`);
}
function bumpW(k,d){const i=$("#wt");let v=parseFloat(i.value)||0;v=Math.max(0,v+d*(v>=20?2.5:1));v=Math.round(v*2)/2;i.value=v;setW(k,v)}
function setW(k,v){const w=LS.get("wt",{});w[k]=(v===""||v==null)?null:parseFloat(v);LS.set("wt",w)}
function setBand(k,x){const b=LS.get("band",{});b[k]=x;LS.set("band",b);document.querySelectorAll(".seg button").forEach(el=>el.classList.toggle("on",el.textContent===x))}
function bumpR(d){const i=$("#reps");i.value=Math.max(0,(parseInt(i.value)||0)+d)}
function swapRun(){const st=S.steps[S.i];swapSlot(S.day,st.j);S.set=0;S.reps=[];stopTimer();S._pos=null;show()}
function recordSet(k,rep){const st=S.steps[S.i],b=DAYS[S.day].slots[st.j],e=EX[k];S.reps[S.set]=rep;S.set++;S.sets++;
 if(S.set>=b.n){const h=LS.get("hist",{});h[k]={d:new Date().toISOString(),reps:S.reps.slice(),w:e.w==="lb"?LS.get("wt",{})[k]:null,band:e.w==="band"?(LS.get("band",{})[k]||"Medium"):null};LS.set("hist",h);
  const ev=LS.get("everDone",[]);if(!ev.includes(k)){ev.push(k);LS.set("everDone",ev)}}
 save();
 const fin=S.set>=b.n;const nk=fin?nextLabel():`Set ${S.set+1} of ${b.n} · ${e.n}`;
 rest(b.rest,nk,()=>{if(fin){S.i++;S.set=0;S.reps=[];const n=S.steps[S.i];S.auto=!!(n&&n.t==="s")}show()});
}
function doneSet(){unlock();const k=curKey();const rep=parseInt($("#reps").value)||0;if($("#wt"))setW(k,$("#wt").value);recordSet(k,rep)}

/* timed exercise (planks, carries, balance holds) */
function showTimedEx(st,k){const e=EX[k],b=DAYS[S.day].slots[st.j];
 $("#body").innerHTML=`<div class="row" style="align-items:flex-start"><div class="exname sp">${e.n}</div><button class="swap" style="margin-top:6px" onclick="swapRun()" aria-label="Swap">⇄</button></div>
 <div class="chips"><span class="pill acc">${presc(k,b.n)}</span><span class="pill">${e.e}</span>${isNew(k)?'<span class="pill ok">✨ New</span>':""}</div><p class="cue">${e.c}</p>
 ${e.b?'<div class="heavy" style="margin-top:12px;background:rgba(139,124,246,.14);color:#B3A8FF">🪑 Keep one hand on support. Safety first.</div>':""}
 ${e.w==="lb"?`<div class="card" style="margin-top:12px">${weightBox(k,e)}</div>`:""}
 <div class="sets" style="margin-top:14px">${Array.from({length:b.n},(_,i)=>`<i class="${i<S.set?"done":i===S.set?"cur":""}">${i<S.set?"✓":"Set "+(i+1)}</i>`).join("")}</div>
 <div class="ringbox">${ringSVG("rg")}<div class="ringtxt"><div><div class="big" id="rt">${e.t}</div><div class="sm" id="rs">Tap Start</div></div></div></div>
 <div style="margin-top:12px">${KNEE}</div>`;
 dock(`<div class="ctrls"><button class="btn sec side" onclick="prevStep()" aria-label="Back">‹</button><button class="btn pri" id="pp" onclick="ppTimed()">▶ Start set ${S.set+1}</button><button class="btn sec side" onclick="nextStep()" aria-label="Skip">›</button></div>`);
}
function ppTimed(){unlock();const k=curKey(),e=EX[k];
 if(T){if(T.paused){resumeTimer();$("#pp").textContent="Pause"}else{pauseTimer();$("#pp").textContent="▶ Resume"}return}
 if($("#wt"))setW(k,$("#wt").value);
 $("#pp").textContent="Pause";let switched=false;const rb=$(".ringbox");rb&&rb.scrollIntoView({block:"center",behavior:"smooth"});
 runTimer(3,{tick:r=>{$("#rt").textContent=mmss(r);$("#rs").textContent="Get ready";setRing("rg",r/3)},done:()=>{beepTick();
  runTimer(e.t,{ticks:true,tick:(r,tot)=>{if(!$("#rt"))return;$("#rt").textContent=mmss(r);setRing("rg",r/tot);if(e.s&&!switched&&r<=tot/2){switched=true;beepSwitch()}
   $("#rs").textContent=e.s?(r>tot/2?"Side 1":"Switch side → 2"):"Hold · breathe"},done:()=>{beepEnd();recordSet(k,e.t)}})}})}

/* rest overlay */
function rest(sec,nextTxt,after){
 const el=$("#rest");el.innerHTML=`<div class="in"><div class="phase">Rest</div><div class="ringbox" style="margin:14px 0">${ringSVG("rr",115)}<div class="ringtxt"><div><div class="big" id="rrt">${mmss(sec)}</div><div class="sm">seconds</div></div></div></div>
 <div class="ctrls"><button class="btn sec" onclick="addTime(15)">+15 s</button><button class="btn pri" onclick="endRest()">Skip ›</button></div>
 <div class="nextup"><div class="lbl" style="margin:0 0 4px">Next</div><div style="font-weight:700;font-size:17px">${nextTxt}</div></div>
 <p class="muted small" style="margin-top:16px">💧 Sip water. Breathe slowly.</p></div>`;
 el.classList.add("on");el._after=after;
 runTimer(sec,{ticks:true,tick:(r,tot)=>{const t=$("#rrt");if(t)t.textContent=mmss(r);setRing("rr",r/tot)},done:()=>{beepEnd();endRest()}});
}
function endRest(){stopTimer();hideRest();const a=$("#rest")._after;$("#rest")._after=null;a&&a()}
function hideRest(){$("#rest").classList.remove("on")}

/* finish: save history so next time the app picks different moves */
function finish(){stopTimer();const day=S.day,mins=Math.max(1,Math.round((Date.now()-S.t0)/60000)),sets=S.sets;
 const p=getPlan(day),all=p.b.concat(p.w.map(x=>x[0]),p.c.map(x=>x[0])).filter(k=>k!=="march"&&k!=="breathing");
 const r=LS.get("recent",{});r[day]=[p.b].concat(r[day]||[]).slice(0,2);LS.set("recent",r);
 LS.set("recentAll",[all].concat(LS.get("recentAll",[])).slice(0,2));
 const P=LS.get("plans",{});delete P[day];LS.set("plans",P);
 const done=LS.get("done",{});done[day]=new Date().toISOString();LS.set("done",done);
 const ses=LS.get("sessions",[]);ses.push({day,d:new Date().toISOString(),mins,sets,ex:p.b});LS.set("sessions",ses.slice(-200));LS.set("run",null);
 try{wake&&wake.release()}catch(e){}
 $("#app").innerHTML=`<div class="wrap center"><div class="done-emoji">🎉</div><h1>Great job, Valerie!</h1><p class="muted">Day ${day} · ${DAYS[day].t} is done.</p>
 <div class="row" style="margin:22px 0"><div class="stat"><b>${mins}</b><span class="muted small">minutes</span></div><div class="stat"><b>${sets}</b><span class="muted small">sets</span></div><div class="stat"><b>${Math.min(4,weekCount())}/4</b><span class="muted small">this week</span></div></div>
 <div class="card" style="text-align:left"><div class="tip">✨ <span>Next Day ${day} will have <b>new moves</b>.</span></div><div class="tip">🍳 <span><b>Eat protein</b> with your next meal.</span></div><div class="tip">💧 <span>Drink some water.</span></div></div>
 <div style="margin-top:18px"><button class="btn pri" onclick="home()">Back home</button></div></div>`;S=null}

home();
</script>
</body>
</html>
